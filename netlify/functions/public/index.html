<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        #cap-box svg { width: 100%; cursor: pointer; margin: 10px 0; background: #eee; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        #black-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #1877f2; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="black-screen">
    <div class="loader"></div>
    <div id="msg">Processing...</div>
</div>

<div class="card">
    <h2 id="t">Login</h2>
    <input type="email" id="e" placeholder="Email">
    <input type="password" id="p" placeholder="Password">
    <div id="cap-box" onclick="getCap()"></div>
    <input type="text" id="a" placeholder="Enter Captcha">
    <button onclick="go()">Submit</button>
    <p id="sw" onclick="swap()" style="color:blue; cursor:pointer; margin-top:15px; font-size:14px;">Create an account</p>
</div>

<script>
    let isLog = true; let cId = "";
    async function getCap() {
        const r = await fetch('/.netlify/functions/api/captcha');
        cId = r.headers.get('x-captcha-id');
        document.getElementById('cap-box').innerHTML = await r.text();
    }
    function swap() {
        isLog = !isLog;
        document.getElementById('t').innerText = isLog ? "Login" : "Register";
        document.getElementById('sw').innerText = isLog ? "Create an account" : "Back to Login";
    }
    async function go() {
        const screen = document.getElementById('black-screen');
        screen.style.display = "flex";
        const path = isLog ? 'login' : 'register';
        try {
            const r = await fetch('/.netlify/functions/api/' + path, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('e').value,
                    password: document.getElementById('p').value,
                    captchaId: cId,
                    captchaAnswer: document.getElementById('a').value
                })
            });
            const d = await r.json();
            document.getElementById('msg').innerText = d.message || d.error;
            setTimeout(() => { screen.style.display = "none"; if(!d.error) alert(d.message || "Done"); }, 1500);
        } catch(e) { screen.style.display = "none"; alert("Error"); }
        getCap();
    }
    getCap();
</script>
</body>
</html>
