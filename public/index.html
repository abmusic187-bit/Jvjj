<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure System</title>
    <style>
        body { font-family: sans-serif; background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 300px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        #cap svg { width: 100%; height: 80px; background: #fff; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .loader { border: 4px solid #333; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="loader"></div>
        <div id="status">Connecting...</div>
    </div>
    <div class="card">
        <h2 id="title">Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <div id="cap" onclick="getCaptcha()"></div>
        <input type="text" id="ans" placeholder="Enter Captcha">
        <button onclick="submitData()">Submit</button>
        <p onclick="toggle()" id="toggle-text" style="cursor:pointer; color:#007bff; margin-top:15px; font-size:14px;">Need an account? Register</p>
    </div>

    <script>
        let isLogin = true; let capId = "";
        async function getCaptcha() {
            const r = await fetch('/.netlify/functions/api/captcha');
            capId = r.headers.get('x-captcha-id');
            document.getElementById('cap').innerHTML = await r.text();
        }
        function toggle() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Login" : "Register";
            document.getElementById('toggle-text').innerText = isLogin ? "Need an account? Register" : "Back to Login";
        }
        async function submitData() {
            const overlay = document.getElementById('overlay');
            overlay.style.display = "flex";
            const path = isLogin ? 'login' : 'register';
            try {
                const res = await fetch('/.netlify/functions/api/' + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('pass').value,
                        captchaId: capId,
                        captchaAnswer: document.getElementById('ans').value
                    })
                });
                const data = await res.json();
                document.getElementById('status').innerText = data.message || data.error;
                setTimeout(() => { 
                    overlay.style.display = "none"; 
                    if(data.message) alert(data.message);
                }, 1500);
            } catch (e) {
                overlay.style.display = "none";
                alert("Connection Error. Is Netlify building?");
            }
            getCaptcha();
        }
        getCaptcha();
    </script>
</body>
</html>
