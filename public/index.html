<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auth</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        #captcha-container svg { width: 100%; cursor: pointer; margin: 10px 0; border-radius: 5px; background: #fafafa; }
        button { width: 100%; padding: 12px; background: #2575fc; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Black Screen Overlay */
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2575fc;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="overlay">
    <div class="spinner"></div>
    <div id="status-text">Processing...</div>
</div>

<div class="card">
    <h2 id="form-title">Login</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <div id="captcha-container" onclick="fetchCaptcha()"></div>
    <input type="text" id="captcha-input" placeholder="Enter Captcha">
    <button onclick="handleAuth()">Submit</button>
    <p id="toggle-link" onclick="toggleAuth()" style="color:#2575fc; cursor:pointer; margin-top:15px; font-size:14px;">Need an account? Register</p>
</div>

<script>
    let isLogin = true;
    let currentCaptchaId = "";

    async function fetchCaptcha() {
        const res = await fetch('/.netlify/functions/api/captcha');
        currentCaptchaId = res.headers.get('x-captcha-id');
        document.getElementById('captcha-container').innerHTML = await res.text();
    }

    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "Login" : "Register";
        document.getElementById('toggle-link').innerText = isLogin ? "Need an account? Register" : "Already have an account? Login";
    }

    async function handleAuth() {
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status-text');
        
        overlay.style.display = "flex";
        status.innerText = isLogin ? "Verifying Identity..." : "Creating Secure Profile...";

        const endpoint = isLogin ? 'login' : 'register';
        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            captchaId: currentCaptchaId,
            captchaAnswer: document.getElementById('captcha-input').value
        };

        try {
            const res = await fetch('/.netlify/functions/api/' + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (res.ok) {
                status.innerText = "Success!";
                setTimeout(() => {
                    overlay.style.display = "none";
                    alert(data.message);
                }, 800);
            } else {
                overlay.style.display = "none";
                alert("Error: " + data.error);
                fetchCaptcha();
            }
        } catch (err) {
            overlay.style.display = "none";
            alert("Connection error. Check console.");
        }
    }
    fetchCaptcha();
</script>
</body>
  </html>
